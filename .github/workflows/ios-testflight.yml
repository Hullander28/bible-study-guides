# Builds Bible Study Guides for iOS on a GitHub macOS runner and uploads it to TestFlight.
# Do not run until an App ID and App Store Connect app record exist. This workflow
# does not create those.
#
# Repository secrets:
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_KEY (the .p8 contents), APPLE_TEAM_ID,
#   IOS_DISTRIBUTION_P12, IOS_DISTRIBUTION_P12_PASSWORD, IOS_KEYCHAIN_PASSWORD,
#   IOS_PROVISIONING_PROFILE.
# Signing is manual with an Apple Distribution certificate and the
# "Study Guides App Store" profile.
#
# The web copy in mobile/www is built on the runner with tools/build_store_www.py,
# which turns ESV off on a temporary copy only. The committed tree stays ESV-on.
name: iOS TestFlight
on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]
jobs:
  build:
    # macos-15 (arm64) hosted runners are capacity-constrained and often
    # cancel public-repo jobs after 15 minutes with "not acquired by Runner".
    # macos-15-intel is a separate pool; Xcode still builds the arm64 iOS app.
    runs-on: macos-15-intel
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Build store www (ESV off) and sync iOS
        run: npm run build:web && npx cap sync ios
      - name: Confirm ESV is off in www and still on in the checkout
        run: |
          test ! -f www/data/verses-esv.json
          grep -q 'ESV_ENABLED: false' www/js/config.js
          grep -q 'ESV_ENABLED: true' ../js/config.js
          test -f ../data/verses-esv.json
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          python3 -c 'import base64,os,pathlib; t=pathlib.Path(os.environ["RUNNER_TEMP"]); t.joinpath("dist.p12").write_bytes(base64.b64decode(os.environ["P12_BASE64"])); p=pathlib.Path.home()/"Library/MobileDevice/Provisioning Profiles"; p.mkdir(parents=True, exist_ok=True); (p/"StudyGuides_AppStore.mobileprovision").write_bytes(base64.b64decode(os.environ["PROFILE_BASE64"]))'
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -archivePath $RUNNER_TEMP/StudyGuides.xcarchive archive \
            CURRENT_PROJECT_VERSION=$((100 + ${{ github.run_number }})) \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Study Guides App Store"
      - name: Export and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("export.plist").write_text("""<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string><key>teamID</key><string>%s</string><key>signingStyle</key><string>manual</string><key>signingCertificate</key><string>Apple Distribution</string><key>provisioningProfiles</key><dict><key>org.thecreedofink.studyguides</key><string>Study Guides App Store</string></dict></dict></plist>\n""" % os.environ["TEAM_ID"])'
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/StudyGuides.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
