<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Study Guides</title>
<meta name="description" content="Book-by-book Bible study guides with outlines, themes, chapter questions, progress tracking and notes.">
<meta name="theme-color" content="#7a4b1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=JSON.parse(localStorage.getItem('bsg:v1')||'{}').theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <a href="#/" class="brand" aria-label="Home"><span class="logo">✦</span> Study Guides</a>
  <div class="top-actions">
    <label class="tr-wrap"><span class="visually-hidden">Translation</span>
      <select id="trPick" class="tr-pick" aria-label="Bible translation"></select>
    </label>
    <a href="#/search" class="icon-btn" aria-label="Search">🔍</a>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>
<main id="app" tabindex="-1"><p class="loading">Loading…</p></main>
<footer class="foot">
  <p>Scripture quotations are from the Berean Standard Bible (BSB), Modern • public domain.</p>
  <p>Study notes, summaries and questions are original to this app. Chapter links open the full text on BibleGateway.</p>
</footer>
<script src="js/books.js"></script>
<script src="js/plans.js"></script>
<script src="js/memory.js"></script>
<script src="js/config.js"></script>
<script src="js/translations.js"></script>
<script src="js/app.js"></script>

</html>
